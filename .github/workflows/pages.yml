name: Publicar y actualizar alertas SMN y rayos
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Caché de alertas SMN ya descargadas
        uses: actions/cache@v4
        with:
          path: .capcache
          key: smn-${{ github.run_id }}
          restore-keys: smn-
      - name: Descargar alertas SMN
        timeout-minutes: 5
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/smn.py data/alerts.json
      - name: Caché de rayos ya procesados
        uses: actions/cache@v4
        with:
          path: .raycache
          key: rayos-${{ github.run_id }}
          restore-keys: rayos-
      - name: Rayos del satélite GOES-19
        continue-on-error: true
        run: |
          pip install -q numpy h5py
          python3 scripts/rayos.py data/rayos.json
      - name: Armar sitio
        run: mkdir _site && cp -r index.html style.css app.js sw.js manifest.webmanifest icons data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

name: Verificar sitio publicado
on:
  push:
    branches: [prueba-rayos]
    paths: ['prueba/verificar.py', '.github/workflows/verificar-sitio.yml']
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 prueba/verificar.py 2>&1 | tee prueba/verificar.log
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prueba/verificar.log && git commit -m "Verificación [skip ci]" || true
          git push || true

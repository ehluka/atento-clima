name: Probar zonas con datos reales
on:
  push:
    branches: [prueba-rayos]
    paths: ['prueba/zona_real.py', 'prueba/site/**', '.github/workflows/zona-real.yml']
permissions:
  contents: write
jobs:
  z:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python3 -m playwright install --with-deps chromium > /dev/null
      - run: python3 prueba/zona_real.py 2>&1 | tee prueba/zona_real.log
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prueba/zona_real.log prueba/*.png && git commit -m "Zonas reales [skip ci]" || true
          git push || true

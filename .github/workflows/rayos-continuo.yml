name: Rayos cada 5 minutos
# El cron de GitHub se atrasa (a veces horas). Este trabajo queda corriendo ~5,5 h y publica
# rayos.json cada 5 min en la rama "datos" (un solo commit, se reemplaza). El cron solo lo relanza.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rayos-continuo
  cancel-in-progress: false
jobs:
  rayos:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .raycache
          key: rayos-cont-${{ github.run_id }}
          restore-keys: rayos-cont-
      - run: pip install -q numpy h5py
      - name: Bucle de 5 minutos
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p /tmp/datos && cd /tmp/datos && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$GITHUB_WORKSPACE"
          fin=$((SECONDS + 330 * 60))
          while [ $SECONDS -lt $fin ]; do
            if timeout 240 python3 scripts/rayos.py /tmp/datos/rayos.json; then
              (cd /tmp/datos && git checkout -q --orphan n && git add rayos.json && git commit -qm "rayos $(date -u +%H:%M)" \
                && git push -qf origin n:datos && git branch -qM n main 2>/dev/null; git checkout -q main 2>/dev/null; git branch -qD n 2>/dev/null; true) \
                || echo "no se pudo publicar"
            fi
            sleep $(( 300 - $(date +%s) % 300 + 40 ))
          done

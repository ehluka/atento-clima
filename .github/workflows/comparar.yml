name: Comparar con Piedra Libre
on:
  push:
    branches: [prueba-rayos]
    paths: ['prueba/comparar.py', '.github/workflows/comparar.yml']
permissions:
  contents: write
jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python3 -m playwright install --with-deps chromium > /dev/null
      - run: python3 prueba/comparar.py 2>&1 | tee prueba/comparar.log
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prueba/comparar.log && git commit -m "Comparación [skip ci]" || true
          git push || true
